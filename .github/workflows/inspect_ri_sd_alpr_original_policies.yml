name: Inspect Rhode Island and South Dakota original police ALPR policy PDFs
on:
  push:
    paths:
      - 'scripts/inspect_ri_sd_alpr_original_policies.py'
      - 'scripts/test_inspect_ri_sd_alpr_original_policies.py'
      - '.github/workflows/inspect_ri_sd_alpr_original_policies.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7' 'pymupdf>=1.24,<1.27'
      - run: python -m unittest discover -s scripts -p 'test_inspect_ri_sd_alpr_original_policies.py' -v
      - run: python scripts/inspect_ri_sd_alpr_original_policies.py
