name: Inspect Dakota County 2025 original Nebraska Flock aggregate report
on:
  push:
    paths:
      - 'scripts/inspect_nebraska_dakota_2025_original.py'
      - '.github/workflows/inspect_nebraska_dakota_2025_original.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf>=1.24,<1.27'
      - run: python scripts/inspect_nebraska_dakota_2025_original.py
