name: Inspect additional original government ALPR oversight reports
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/inspect_national_oversight_originals.py'
      - '.github/workflows/inspect_national_oversight_originals.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python scripts/inspect_national_oversight_originals.py
