name: Triage AGO-linked Washington external original policy sources
on:
  push:
    paths:
      - 'scripts/triage_wa_ag_external_originals.py'
      - 'scripts/test_triage_wa_ag_external_originals.py'
      - '.github/workflows/triage_wa_ag_external_originals.yml'
      - 'data/wa-original-agency-alpr-registrations.json'
      - 'data/wa-ag-external-policy-source-inspection.json'
  workflow_dispatch:
  schedule:
    - cron: '19 19 * * 2'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - name: Verify exact AGO external source identity and no fact promotion
        run: python -m unittest discover -s scripts -p 'test_triage_wa_ag_external_originals.py' -v
      - name: Check 25 external state-linked source URLs read-only
        run: python scripts/triage_wa_ag_external_originals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wa-external-ag-linked-original-source-receipts
          path: .katoptron-ci/wa-ag-external-original-policy-source-receipts.json
          retention-days: 21
          if-no-files-found: warn
