name: Preflight New York Flock program and termination original, West Virginia legislative oversight
on:
  push:
    paths:
      - 'scripts/preflight_ny_wv_original_flock_records.py'
      - 'scripts/test_preflight_ny_wv_original_flock_records.py'
      - '.github/workflows/preflight_ny_wv_original_flock_records.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python -m unittest discover -s scripts -p 'test_preflight_ny_wv_original_flock_records.py' -v
      - run: python scripts/preflight_ny_wv_original_flock_records.py
