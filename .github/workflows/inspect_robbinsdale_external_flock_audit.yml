name: Inspect Robbinsdale original state audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/inspect_robbinsdale_external_flock_audit.py'
      - '.github/workflows/inspect_robbinsdale_external_flock_audit.yml'
      - 'data/verified-robbinsdale-2025-independent-flock-audit.json'
      - 'scripts/verify_robbinsdale_independent_flock_audit.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python scripts/inspect_robbinsdale_external_flock_audit.py
      - run: python scripts/verify_robbinsdale_independent_flock_audit.py
