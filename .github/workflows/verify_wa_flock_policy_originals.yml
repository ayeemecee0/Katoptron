name: Verify individually reviewed Washington Flock original policy pages
on:
  push:
    paths:
      - 'data/verified-wa-flock-policy-originals.json'
      - 'data/wa-ago-original-policy-source-inspection.json'
      - 'data/wa-original-agency-alpr-registrations.json'
      - 'wa-reviewed-flock-sources.js'
      - 'scripts/verify_wa_flock_policy_originals.py'
      - 'scripts/test_verify_wa_flock_policy_originals.py'
      - 'scripts/test_wa_reviewed_flock_sources.cjs'
      - '.github/workflows/verify_wa_flock_policy_originals.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 18 * * 4'
permissions:
  contents: read
jobs:
  verified-frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: node --check wa-reviewed-flock-sources.js
      - run: node scripts/test_wa_reviewed_flock_sources.cjs
      - run: python -m unittest discover -s scripts -p 'test_verify_wa_flock_policy_originals.py' -v
      - run: python scripts/verify_wa_flock_policy_originals.py
