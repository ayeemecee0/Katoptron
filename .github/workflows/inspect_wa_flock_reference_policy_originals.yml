name: Inspect three state-linked WA policy PDF reference pages
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/inspect_wa_flock_reference_policy_originals.py'
      - '.github/workflows/inspect_wa_flock_reference_policy_originals.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'pypdf>=5,<7'
      - run: python3 scripts/inspect_wa_flock_reference_policy_originals.py
