name: Check nationwide community Flock map
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'community-map.html'
      - 'scripts/smoke_community_osm.cjs'
      - 'scripts/smoke_community_overlay.cjs'
      - 'scripts/smoke_community_route.cjs'
      - 'scripts/smoke_dense_community_corridor.cjs'
      - 'community-route.js'
      - 'community-overlay.js'
      - 'index.html'
      - 'map.js'
      - '.github/workflows/check_community_osm.yml'
permissions:
  contents: read
concurrency:
  group: katoptron-community-map-browser
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Chromium client
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Serve public static site locally
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/katoptron-map-http.log 2>&1 &
      - name: Verify nationwide community map renders a public Supabase camera record
        env:
          KATOPTRON_SMOKE_BASE: http://127.0.0.1:8765/
        run: |
          node scripts/smoke_community_osm.cjs
          node scripts/smoke_community_overlay.cjs
          node scripts/smoke_community_route.cjs
          node scripts/smoke_dense_community_corridor.cjs
