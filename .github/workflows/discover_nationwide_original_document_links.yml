name: Discover original government ALPR document links from nationwide publisher sources
on:
  push:
    paths:
      - 'scripts/discover_nationwide_original_document_links.py'
      - 'scripts/test_discover_nationwide_original_document_links.py'
      - 'data/nationwide-government-jurisdiction-registry.json'
      - 'data/nationwide-original-government-source-receipts.json'
      - '.github/workflows/discover_nationwide_original_document_links.yml'
  workflow_dispatch:
  schedule:
    - cron: '31 19 * * 3'
permissions:
  contents: read
concurrency:
  group: katoptron-nationwide-original-government-publisher-link-review
  cancel-in-progress: false
jobs:
  original-publisher-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - name: Validate original state-publisher identity, privacy exclusions and no facts
        run: python -m unittest discover -s scripts -p 'test_discover_nationwide_original_document_links.py' -v
      - name: Discover same-government-host original document links in all eligible states
        run: python scripts/discover_nationwide_original_document_links.py --workers 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nationwide-original-government-document-links-unverified
          path: .katoptron-ci/nationwide-original-government-document-link-candidates.json
          retention-days: 21
          if-no-files-found: warn
