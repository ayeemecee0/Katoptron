name: Inspect Washington Flock-term original policy page evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/inspect_wa_flock_policy_pages.py'
      - '.github/workflows/inspect_wa_flock_policy_pages.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python scripts/inspect_wa_flock_policy_pages.py
