name: Triage all versioned Washington AGO-linked original policy PDFs
on:
  push:
    paths:
      - 'scripts/triage_wa_ago_policy_origins.py'
      - 'scripts/test_triage_wa_ago_policy_origins.py'
      - 'data/wa-original-agency-alpr-registrations.json'
      - 'data/wa-ago-original-policy-source-inspection.json'
      - '.github/workflows/triage_wa_ago_policy_origins.yml'
  workflow_dispatch:
  schedule:
    - cron: '51 19 * * 1'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - name: Exact-source provenance and negative tests
        run: python -m unittest discover -s scripts -p 'test_triage_wa_ago_policy_origins.py' -v
      - name: Bounded parallel checks of only AGO version-pinned PDF originals
        run: python scripts/triage_wa_ago_policy_origins.py --workers 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: washington-ago-original-policy-metadata-triage
          path: .katoptron-ci/wa-ag-linked-policy-original-receipts.json
          retention-days: 21
          if-no-files-found: error
