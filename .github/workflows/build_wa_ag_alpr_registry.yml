name: Build Washington AGO original agency ALPR registration index
on:
  push:
    paths:
      - 'scripts/build_wa_ag_alpr_registry.py'
      - 'scripts/test_build_wa_ag_alpr_registry.py'
      - '.github/workflows/build_wa_ag_alpr_registry.yml'
  workflow_dispatch:
  schedule:
    - cron: '11 20 * * 2'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python -m unittest discover -s scripts -p 'test_build_wa_ag_alpr_registry.py' -v
      - run: python scripts/build_wa_ag_alpr_registry.py --print-snapshot-json
      - uses: actions/upload-artifact@v4
        with:
          name: wa-official-agency-alpr-public-registration-snapshot
          path: .katoptron-ci/wa-alpr-public-registration-snapshot.json
          retention-days: 14
          if-no-files-found: error
