name: Fingerprint original Minnesota Flock ALPR audit PDFs
on:
  workflow_dispatch:
  schedule:
    - cron: '42 17 * * 3'
  push:
    paths:
      - 'scripts/fingerprint_mn_flock_audits.py'
      - 'scripts/test_fingerprint_mn_flock_audits.py'
      - '.github/workflows/fingerprint_mn_flock_audits.yml'
      - 'supabase/migrations/145_m10_private_minnesota_original_pdf_fingerprints.sql'
permissions:
  contents: read
concurrency:
  group: katoptron-mn-original-pdf-receipt-fingerprint
  cancel-in-progress: false
jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded PDF extractor
        run: python -m pip install 'pypdf>=5,<7'
      - name: Validate source and evidence boundaries
        run: python -m unittest discover -s scripts -p 'test_fingerprint_mn_flock_audits.py' -v
      - name: Fetch and hash all original Flock-titled PDFs without writing
        run: python scripts/fingerprint_mn_flock_audits.py --preflight
      - name: Require service-only database credential
        if: github.ref == 'refs/heads/main'
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Store machine-only source receipts privately
        if: github.ref == 'refs/heads/main'
        run: python scripts/fingerprint_mn_flock_audits.py
