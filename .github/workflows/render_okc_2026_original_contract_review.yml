name: Render Oklahoma City August 2026 original contract and council pages
on:
  push:
    paths:
      - 'scripts/render_okc_2026_original_contract_review.py'
      - '.github/workflows/render_okc_2026_original_contract_review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visually-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7' 'pymupdf>=1.24,<1.27'
      - run: python scripts/render_okc_2026_original_contract_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: okc-2026-hash-pinned-original-council-contract-pages
          path: .katoptron-ci/okc-original-2026-visual-review/
          if-no-files-found: error
          retention-days: 21
