name: Verify national government oversight original ALPR PDFs
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/verified-national-government-oversight.json'
      - 'scripts/inspect_national_oversight_originals.py'
      - 'scripts/verify_national_government_oversight.py'
      - 'scripts/test_verify_national_government_oversight.py'
      - '.github/workflows/verify_national_government_oversight.yml'
  schedule:
    - cron: '41 19 * * 3'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python -m unittest discover -s scripts -p 'test_verify_national_government_oversight.py' -v
      - run: python scripts/verify_national_government_oversight.py
