name: Inspect candidate original Minnesota historical Flock audits
on:
  push:
    paths: ['.github/workflows/inspect_m10_candidate_originals.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded original PDF reader
        run: python -m pip install 'pypdf>=5,<7'
      - name: Inspect original source provenance and narrowly scoped public auditor excerpts
        run: |
          python - <<'PY'
          import io,hashlib,re,sys
          from pathlib import Path
          from pypdf import PdfReader
          sys.path.insert(0,'scripts')
          from verify_independent_audit_source import get_pdf
          reports={
           'woodbury-2021': 'https://www.lrl.mn.gov/docs/2021/mandated/211119.pdf',
           'edina-2021': 'https://www.lrl.mn.gov/docs/2021/mandated/210885.pdf',
           'shakopee-2022': 'https://www.lrl.mn.gov/docs/2022/mandated/220708.pdf',
           'west-saint-paul-2026':'https://www.lrl.mn.gov/docs/2026/mandated/261167.pdf',
           'wyoming-2026':'https://www.lrl.mn.gov/docs/2026/mandated/261268.pdf',
          }
          for name,url in reports.items():
           try:
            raw=get_pdf(url)
            pdf=PdfReader(io.BytesIO(raw),strict=True)
            assert not pdf.is_encrypted and 1<len(pdf.pages)<=15
            print('SOURCE',name,'SHA256',hashlib.sha256(raw).hexdigest(),'PAGES',len(pdf.pages),'BYTES',len(raw),'URL',url)
            for n in range(min(len(pdf.pages),4)):
             txt=' '.join((pdf.pages[n].extract_text() or '').split())
             low=txt.lower()
             if name.startswith(('wyoming','west-saint-paul')):
              # Reproducible slices of original already-public independent auditor
              # summaries only; no private plate reads, route or user data.
              for term in ['stationary','flock alpr units','retention period','flock system','sharing among law enforcement agencies']:
               i=low.find(term)
               if i>=0:
                print('REVIEW_CONTEXT',name,'PAGE',n+1,'TERM',term,'TEXT',txt[max(0,i-180):i+240][:420])
             else:
              for term in (['no stationary','9 squad cars','60 day','2 squad','elsag plate hunter','three patrol vehicles']):
               i=low.find(term)
               if i>=0:print('HISTORICAL_ANCHOR',name,'PAGE',n+1,'TERM',term,'TEXT',txt[max(0,i-100):i+150][:250])
           except Exception as e:
            print('HELD',name,type(e).__name__,str(e)[:120])
            if name in ('woodbury-2021','edina-2021','shakopee-2022'):raise
          PY
