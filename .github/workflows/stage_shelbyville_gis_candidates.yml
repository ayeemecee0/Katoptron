name: Stage independently attributed Shelbyville Flock GIS privately
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/stage_shelbyville_gis_candidates.py'
      - 'scripts/test_stage_shelbyville_gis_candidates.py'
      - '.github/workflows/stage_shelbyville_gis_candidates.yml'
permissions:
  contents: read
concurrency:
  group: katoptron-shelbyville-private-research
  cancel-in-progress: false
jobs:
  stage-unreviewed:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regress append-only evidence reconciliation and deny premature approval
        run: python -m unittest discover -s scripts -p 'test_stage_shelbyville_gis_candidates.py' -v
      - name: Confirm existing server-only credential
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "::error::Private camera research cannot be staged without server credential"
            exit 1
          }
      - name: Stage exact source points and attestation receipts privately, with overlap hold
        run: python scripts/stage_shelbyville_gis_candidates.py --stage-private
