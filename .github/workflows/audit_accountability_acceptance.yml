      - 'national-government-sources.js'
      - 'national-primary-documents.js'
      - 'data/verified-national-government-documents.json'
      - 'data/wa-original-agency-alpr-registrations.json'
      - 'wa-alpr-registrations.js'
      - 'wa-alpr-registrations.html'
