      - 'data/verified-wa-kittitas-scanned-draft-review.json'
      - 'scripts/test_wa_external_policy_origins.cjs'
      - 'scripts/test_wa_kittitas_draft_review.cjs'
      - 'data/verified-wa-flock-policy-originals.json'
      - 'scripts/test_wa_reviewed_flock_sources.cjs'
      - 'wa-policy-source-triage.js'
      - 'wa-held-original-diagnostics.js'
      - 'data/wa-held-original-policy-diagnostics.json'
      - 'scripts/test_wa_held_original_diagnostics.cjs'
      - 'data/wa-ago-original-policy-source-inspection.json'
      - 'scripts/test_wa_policy_source_triage.cjs'
