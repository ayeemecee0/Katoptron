name: Verify Washington original agency ALPR policy documents
on:
  push:
    paths:
      - 'data/verified-wa-agency-policies.json'
      - 'data/wa-original-agency-alpr-registrations.json'
      - 'wa-original-policies.js'
      - 'scripts/verify_wa_original_policies.py'
      - 'scripts/test_verify_wa_original_policies.py'
      - 'scripts/test_wa_original_policies.cjs'
      - '.github/workflows/verify_wa_original_policies.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * 3'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded PDF reader
        run: python -m pip install 'pypdf>=5,<7'
      - name: Verify provenance and fail-closed negative tests
        run: |
          node --check wa-original-policies.js
          node scripts/test_wa_original_policies.cjs
          python -m unittest discover -s scripts -p 'test_verify_wa_original_policies.py' -v
      - name: Fetch exact versioned state-linked and city-hosted originals
        run: python scripts/verify_wa_original_policies.py
