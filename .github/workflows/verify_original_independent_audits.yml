name: Verify original independent agency ALPR audit sources
on:
  schedule:
    - cron: '37 17 * * 2'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/verified-independent-audits.json'
      - 'scripts/verify_independent_audit_source.py'
      - 'scripts/test_verify_independent_audit_source.py'
      - '.github/workflows/verify_original_independent_audits.yml'
permissions:
  contents: read
concurrency:
  group: katoptron-original-auditor-source-freshness
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check original government URL and source-identity guards without network
        run: python -m unittest discover -s scripts -p 'test_verify_independent_audit_source.py' -v
      - name: Install supported PDF reader
        run: python -m pip install 'pypdf>=5,<7'
      - name: Verify bounded original government PDF is still present and matching reviewed pages
        run: python scripts/verify_independent_audit_source.py
