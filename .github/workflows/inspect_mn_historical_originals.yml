name: Inspect remaining original Minnesota historical audit candidates
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/inspect_mn_historical_originals.py'
      - '.github/workflows/inspect_mn_historical_originals.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python scripts/inspect_mn_historical_originals.py
