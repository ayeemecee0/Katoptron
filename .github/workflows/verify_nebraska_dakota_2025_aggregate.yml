name: Verify Nebraska 2025 original agency-reported aggregate ALPR statistics
on:
  push:
    paths:
      - 'data/verified-nebraska-original-aggregate-reports.json'
      - 'scripts/inspect_nebraska_dakota_2025_original.py'
      - 'scripts/verify_nebraska_dakota_2025_aggregate.py'
      - 'scripts/test_verify_nebraska_dakota_2025_aggregate.py'
      - '.github/workflows/verify_nebraska_dakota_2025_aggregate.yml'
  workflow_dispatch:
  schedule:
    - cron: '13 19 * * 5'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf>=1.24,<1.27'
      - run: python -m unittest discover -s scripts -p 'test_verify_nebraska_dakota_2025_aggregate.py' -v
      - run: python scripts/verify_nebraska_dakota_2025_aggregate.py
