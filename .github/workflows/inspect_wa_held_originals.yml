name: Diagnose held Washington AGO source PDFs without publication
on:
  push:
    paths:
      - '.github/workflows/inspect_wa_held_originals.yml'
      - 'scripts/inspect_wa_unreadable_originals.py'
      - 'data/wa-held-original-policy-diagnostics.json'
      - 'scripts/test_inspect_wa_unreadable_originals.py'
  workflow_dispatch:
  schedule:
    - cron: '47 19 * * 5'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python -m unittest discover -s scripts -p 'test_inspect_wa_unreadable_originals.py' -v
      - run: python scripts/inspect_wa_unreadable_originals.py
