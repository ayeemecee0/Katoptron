name: Inspect Idaho Falls and Columbia government ALPR governance originals
on:
  push:
    paths:
      - 'scripts/inspect_idaho_columbia_originals.py'
      - '.github/workflows/inspect_idaho_columbia_originals.yml'
      - 'scripts/test_inspect_idaho_columbia_originals.py'
      - 'scripts/verify_idaho_columbia_policy_originals.py'
      - 'scripts/test_verify_idaho_columbia_policy_originals.py'
      - 'data/verified-idaho-columbia-government-policy-originals-2026-10-27.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-pdfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded original-PDF reader
        run: python -m pip install 'pypdf>=5,<7'
      - name: Validate source whitelist, fixed page counts and non-publication boundary
        run: |
          python3 -m py_compile scripts/inspect_idaho_columbia_originals.py
          python3 -m unittest discover -s scripts -p 'test_inspect_idaho_columbia_originals.py' -v
          python3 -m unittest discover -s scripts -p 'test_verify_idaho_columbia_policy_originals.py' -v
      - name: Independently match government-published original hashes and page-specific claims
        run: python3 scripts/verify_idaho_columbia_policy_originals.py
      - name: Retrieve original two-state government policy text and page receipts
        run: python3 scripts/inspect_idaho_columbia_originals.py
