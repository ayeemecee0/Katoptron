name: M9 production capacity and privacy retention
on:
  schedule:
    - cron: '31 17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/142_m9_private_launch_capacity_aggregation.sql'
      - 'scripts/monitor_production_capacity.py'
      - 'scripts/test_monitor_production_capacity.py'
      - 'scripts/test_m9_private_launch_capacity.sql'
      - '.github/workflows/monitor_production_capacity.yml'
permissions:
  contents: read
concurrency:
  group: katoptron-m9-private-capacity-and-privacy-retention
  cancel-in-progress: false
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Confirm private server-side operational credential
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Check private count and retention regression
        run: python -m unittest discover -s scripts -p 'test_monitor_production_capacity.py' -v
      - name: Check current production quota headroom without reading private rows
        run: python scripts/monitor_production_capacity.py
