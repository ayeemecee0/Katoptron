name: Recheck individual Washington AGO Flock phrase original source pages
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/review_wa_flock_original_pages.py'
      - 'scripts/test_review_wa_flock_original_pages.py'
      - 'data/wa-ago-original-policy-source-inspection.json'
      - 'wa-flock-source-review.js'
      - 'wa-flock-source-review.html'
      - 'scripts/test_wa_flock_source_review.cjs'
      - 'agency-evidence-conversion.html'
      - '.github/workflows/review_wa_flock_original_pages.yml'
  schedule:
    - cron: '41 17 * * 3'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - name: Verify public candidate queue never promotes vendor or legal claims
        run: |
          node --check wa-flock-source-review.js
          node scripts/test_wa_flock_source_review.cjs
      - name: Test original identity, source drift and non-publication boundaries
        run: python -m unittest discover -s scripts -p 'test_review_wa_flock_original_pages.py' -v
      - name: Recheck exact SHA-pinned original PDFs and literal page matches
        run: python scripts/review_wa_flock_original_pages.py
      - name: Report what actually passed, not what is adopted
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open(".katoptron-ci/wa-flock-term-page-rechecks.json",encoding="utf8"))
          print("## Washington government-original page review candidates")
          print("Exact original term-page rechecks passed:",d["source_pages_rechecked_successfully"])
          print("Source holds:",d["source_page_recheck_holds"])
          print("\nNo Flock installations, effective policies, live sharing or coordinates established.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wa-flock-sha-pinned-original-page-review-queue
          path: .katoptron-ci/wa-flock-term-page-rechecks.json
          if-no-files-found: error
          retention-days: 21
