name: Discover original city Flock camera map applications nationwide
on:
  workflow_dispatch:
  schedule:
    - cron: '11 15 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/discover_original_gov_camera_map_apps.py'
      - 'scripts/test_discover_original_gov_camera_map_apps.py'
      - '.github/workflows/discover_original_gov_camera_map_apps.yml'
permissions:
  contents: read
concurrency:
  group: katoptron-original-government-camera-maps
  cancel-in-progress: false
jobs:
  original-gov-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test original city links and reject fake ArcGIS publishers
        run: python -m unittest discover -s scripts -p 'test_discover_original_gov_camera_map_apps.py' -v
      - name: Confirm server-only original government discovery credential
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Discover and privately stage exact original city camera map apps
        run: python scripts/discover_original_gov_camera_map_apps.py
