name: National original-source monitor and gap dashboard acceptance
on:
  pull_request:
    paths:
      - 'scripts/watch_nationwide_government_originals.py'
      - 'data/nationwide-recovery-government-originals-2026-10-29.json'
      - 'scripts/nationwide_source_health.py'
      - 'scripts/test_nationwide_source_health.py'
      - 'scripts/test_watch_nationwide_government_originals.py'
      - 'scripts/smoke_nationwide_source_monitor.cjs'
      - 'nationwide-source-monitor.html'
      - '.github/workflows/nationwide_source_health_acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/watch_nationwide_government_originals.py'
      - 'data/nationwide-recovery-government-originals-2026-10-29.json'
      - 'scripts/nationwide_source_health.py'
      - 'scripts/test_nationwide_source_health.py'
      - 'scripts/test_watch_nationwide_government_originals.py'
      - 'scripts/smoke_nationwide_source_monitor.cjs'
      - 'nationwide-source-monitor.html'
      - '.github/workflows/nationwide_source_health_acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - name: Validate original source registry, all 70 sources, source change and held-baseline semantics
        run: |
          python -m unittest discover -s scripts -p 'test_watch_nationwide_government_originals.py' -v
          python -m unittest discover -s scripts -p 'test_nationwide_source_health.py' -v
          python -m unittest discover -s scripts -p 'test_discover_nationwide_original_document_links.py' -v
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node --check scripts/smoke_nationwide_source_monitor.cjs
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/national-source-monitor.log 2>&1 &
      - name: Confirm public historical source health, honest gaps and 51 state navigation
        env:
          KATOPTRON_SMOKE_BASE: http://127.0.0.1:8765/
        run: node scripts/smoke_nationwide_source_monitor.cjs
