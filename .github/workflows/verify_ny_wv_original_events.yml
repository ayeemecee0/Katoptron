name: Verify Tompkins original Flock history and termination, West Virginia hearing originals
on:
  push:
    paths:
      - 'data/verified-ny-wv-original-flock-events.json'
      - 'scripts/preflight_ny_wv_original_flock_records.py'
      - 'scripts/verify_ny_wv_original_events.py'
      - 'scripts/test_verify_ny_wv_original_events.py'
      - '.github/workflows/verify_ny_wv_original_events.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 19 * * 4'
permissions:
  contents: read
jobs:
  original-event-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7' 'pymupdf>=1.24,<1.27'
      - run: python -m unittest discover -s scripts -p 'test_verify_ny_wv_original_events.py' -v
      - run: python scripts/verify_ny_wv_original_events.py
