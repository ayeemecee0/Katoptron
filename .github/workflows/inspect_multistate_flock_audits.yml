name: Inspect original California and Wisconsin Flock audits
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/inspect_multistate_flock_audits.py'
      - '.github/workflows/inspect_multistate_flock_audits.yml'
permissions:
  contents: read
jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python scripts/inspect_multistate_flock_audits.py
