name: Verify nine government original policy contract and oversight PDFs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/inspect_national_link_candidates.py'
      - 'scripts/verify_national_primary_documents.py'
      - 'scripts/test_verify_national_primary_documents.py'
      - 'data/verified-national-government-documents.json'
      - '.github/workflows/verify_national_primary_documents.yml'
  schedule:
    - cron: '33 18 * * 5'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - run: python -m unittest discover -s scripts -p 'test_verify_national_primary_documents.py' -v
      - run: python scripts/verify_national_primary_documents.py
