name: Inspect Washington AGO-linked original ALPR policies
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect_wa_original_policies.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - name: Read bounded exact official state-linked originals; print only text fragments
        run: |
          python - <<'PY'
          import hashlib,io,json,urllib.request
          from pypdf import PdfReader
          d=json.load(open('data/wa-original-agency-alpr-registrations.json',encoding='utf8'))
          names=('Auburn Police Department','Black Diamond Police Department')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):raise ValueError('Unexpected source redirect')
          op=urllib.request.build_opener(NoRedirect())
          for name in names:
           r=next(x for x in d['registrations'] if x['agency_name']==name)
           assert len(r['policy_links_from_official_ago_page'])==1
           url=r['policy_links_from_official_ago_page'][0]
           assert url.startswith(('https://agportal-s3bucket.s3.us-west-2.amazonaws.com/ALPR/','https://blackdiamondwa.gov/DocumentCenter/'))
           req=urllib.request.Request(url,headers={'Accept':'application/pdf','User-Agent':'Katoptron-original-AG-listed-public-policy-review/1.0'})
           with op.open(req,timeout=25) as res:
            assert res.status==200 and res.geturl()==url
            raw=res.read(9_000_001)
           assert 100<len(raw)<=9_000_000 and raw.startswith(b'%PDF-')
           pdf=PdfReader(io.BytesIO(raw),strict=True)
           assert not pdf.is_encrypted and 1<=len(pdf.pages)<=30
           print('WA_POLICY_SOURCE',name,'URL',url,'SHA256',hashlib.sha256(raw).hexdigest(),'PAGES',len(pdf.pages),'BYTES',len(raw))
           for i,p in enumerate(pdf.pages):
            t=' '.join((p.extract_text() or '').lower().split())
            if i in (0,1,3,4,5,6):
             terms=['21 days','21-day','external access','annual','audit','flock','2026','retention','policy','sharing','published','department']
             print('WA_POLICY_PAGE',name,'PAGE',i+1,'TEXTLEN',len(t),'IMAGES',len(p.images),'TERMS',','.join(x for x in terms if x in t))
          PY
