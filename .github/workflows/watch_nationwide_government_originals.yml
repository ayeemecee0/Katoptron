name: Monitor original government Flock records across all US jurisdictions
on:
  push:
    paths:
      - 'data/nationwide-government-jurisdiction-registry.json'
      - 'data/nationwide-recovery-government-originals-2026-10-29.json'
      - 'data/nationwide-targeted-agency-original-depth-2026-10-29.json'
      - 'data/nationwide-reviewed-original-monitor-additions-2026-10-29.json'
      - 'data/manual-original-evidence-review-2026-10-29.json'
      - 'data/editorial-originals-intelligence-batch-2026-10-29.json'
      - 'data/nationwide-original-government-recovery-alternates-2026-10-29.json'
      - 'data/underrepresented-state-original-government-research-2026-10-29.json'
      - 'data/three-high-value-original-publisher-targets-2026-10-29.json'
      - 'data/nationwide-target-agency-original-groups-2026-10-29.json'
      - 'data/nationwide-original-research-leads-expanded-2026-10-29.json'
      - 'scripts/test_nationwide_evidence_depth.cjs'
      - 'data/nationwide-original-change-and-legacy-hold-triage-2026-10-29.json'
      - 'data/national-government-audit-source-portals.json'
      - 'data/19-held-original-issuer-recovery-audit-2026-10-29.json'
      - 'scripts/watch_nationwide_government_originals.py'
      - 'scripts/archive_government_original_versions.py'
      - 'scripts/test_archive_government_original_versions.py'
      - 'scripts/private_original_archive.py'
      - 'scripts/test_private_original_archive.py'
      - 'supabase/functions/private-original-archive/index.ts'
      - 'scripts/triage_nationwide_original_acquisition.py'
      - 'scripts/test_triage_nationwide_original_acquisition.py'
      - 'scripts/nationwide_source_health.py'
      - 'scripts/review_nationwide_source_changes.py'
      - 'data/nationwide-original-document-difference-approvals.json'
      - 'scripts/test_recovered_originals_editorial_changes.py'
      - 'scripts/test_nationwide_source_health.py'
      - 'nationwide-source-monitor.html'
      - 'scripts/test_watch_nationwide_government_originals.py'
      - '.github/workflows/watch_nationwide_government_originals.yml'
  pull_request:
    paths:
      - 'scripts/private_original_archive.py'
      - 'scripts/test_private_original_archive.py'
      - 'supabase/functions/private-original-archive/index.ts'
      - 'scripts/archive_government_original_versions.py'
      - 'scripts/test_archive_government_original_versions.py'
      - 'scripts/watch_nationwide_government_originals.py'
      - 'scripts/nationwide_source_health.py'
      - 'scripts/test_nationwide_source_health.py'
      - 'nationwide-source-monitor.html'
      - 'scripts/test_watch_nationwide_government_originals.py'
      - '.github/workflows/watch_nationwide_government_originals.yml'
  workflow_dispatch:
  schedule:
    - cron: '11 19 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: katoptron-nationwide-original-government-source-watch
  cancel-in-progress: false
jobs:
  national-original-source-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded PDF metadata reader
        run: python -m pip install 'pypdf>=5,<7'
      - name: Unit test 51 jurisdictions, 138 monitored originals and no-policy-publication safeguards
        run: |
          python -m unittest discover -s scripts -p 'test_watch_nationwide_government_originals.py' -v
          python -m unittest discover -s scripts -p 'test_nationwide_source_health.py' -v
          python -m unittest discover -s scripts -p 'test_recovered_originals_editorial_changes.py' -v
          python -m unittest discover -s scripts -p 'test_triage_nationwide_original_acquisition.py' -v
          python -m unittest discover -s scripts -p 'test_archive_government_original_versions.py' -v
          python -m unittest discover -s scripts -p 'test_private_original_archive.py' -v
          node scripts/test_nationwide_evidence_depth.cjs
      - name: Restore last successful fingerprint receipt baseline
        uses: actions/cache/restore@v4
        id: prior
        with:
          path: .katoptron-ci/nationwide-monitor-snapshot.json
          key: katoptron-nationwide-source-health-v2-${{ github.run_id }}
          restore-keys: |
            katoptron-nationwide-source-health-v2-
      - name: Restore prior authenticated original document bytes
        uses: actions/cache/restore@v4
        with:
          path: .katoptron-ci/nationwide-original-baselines
          key: katoptron-original-document-bytes-v1-${{ github.run_id }}
          restore-keys: |
            katoptron-original-document-bytes-v1-
      - name: Restore private originals after complete CI cache eviction
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
        run: python scripts/private_original_archive.py restore-if-missing
      - name: Retrieve 138 original-government URLs including original publisher accountability indexes in CT, NE, and SC
        run: python scripts/watch_nationwide_government_originals.py --workers 6 --capture-originals
      - name: Turn same-host government document links into 25 bounded editorial acquisition tasks
        run: python scripts/triage_nationwide_original_acquisition.py --watch-only
      - name: Compare against prior usable fingerprints and document every held state/source
        run: python scripts/nationwide_source_health.py
      - name: Verify available before and after document bytes and prepare bounded page suggestions
        run: python scripts/archive_government_original_versions.py
      - name: Qualify changed government originals for page-specific editorial review
        run: python scripts/review_nationwide_source_changes.py
      - name: Back up every verified original into private durable storage and read it back
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
        run: python scripts/private_original_archive.py backup
      - name: Prove full SHA-256-authenticated restore after complete cache loss
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
        run: python scripts/private_original_archive.py cold-restore-test
      - name: Publish status counts to workflow summary
        run: |
          python - <<'PY'
          import json,os
          x=json.load(open('.katoptron-ci/nationwide-public-health.json',encoding='utf8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as f:
           f.write('## 50 states + DC original-government source monitoring\n')
           f.write('**Operational URL health, not verified Flock adoption or contract findings.**\n\n')
           for label,key in [('Jurisdictions','jurisdictions'),('Monitored government URLs','monitored_urls'),
             ('Reachable originals','accessible_origins'),('Held originals','held_origins'),
             ('Changed original hashes requiring review','source_hash_changes_pending_individual_review'),
             ('First fingerprint baselines awaiting review','first_baselines_pending_individual_review')]:
            f.write('- '+label+': '+str(x[key])+'\n')
           f.write('\n### States with no accessible monitored original\n')
           missing=[s['state'] for s in x['states'] if s['originals_accessible']==0]
           f.write(', '.join(missing) if missing else 'None of the curated URLs currently inaccessible in entirety')
           f.write('\n\n**Unknown statewide agency, contract, policy and camera coverage remains in all 51 jurisdictions.**\n')
          PY
      - name: Save last-successful fingerprints for following runs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .katoptron-ci/nationwide-monitor-snapshot.json
          key: katoptron-nationwide-source-health-v2-${{ github.run_id }}
      - name: Save authenticated original document bytes for later substantive comparisons
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .katoptron-ci/nationwide-original-baselines
          key: katoptron-original-document-bytes-v1-${{ github.run_id }}
      - name: Upload complete national retrieval receipts, differences and documented gaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nationwide-all-51-government-source-health-${{ github.run_id }}
          path: |
            .katoptron-ci/nationwide-51-jurisdiction-original-source-watch.json
            .katoptron-ci/historical-19-originals-retrieval-recovery.json
            .katoptron-ci/historical-19-originals-recovery-continuity.json
            .katoptron-ci/nationwide-monitor-snapshot.json
            .katoptron-ci/nationwide-public-health.json
            .katoptron-ci/nationwide-documentary-difference-review.json
            .katoptron-ci/nationwide-approved-documentary-differences.json
            .katoptron-ci/nationwide-original-acquisition-editorial-queue.json
            .katoptron-ci/nationwide-before-after-document-candidates.json
            .katoptron-ci/nationwide-original-baselines/manifest.json
          retention-days: 30
          if-no-files-found: warn
