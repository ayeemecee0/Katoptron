name: Visually inspect Tompkins County 2025 original government Flock page
on:
  push:
    paths:
      - 'scripts/render_tompkins_2025_original_page.py'
      - '.github/workflows/render_tompkins_2025_original_page.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7' 'pymupdf>=1.24,<1.27'
      - run: python scripts/render_tompkins_2025_original_page.py
      - uses: actions/upload-artifact@v4
        with:
          name: ny-original-tompkins-sheriff-july-2025-public-report-page-7
          path: .katoptron-ci/ny-tompkins-2025-source-review/
          retention-days: 21
          if-no-files-found: error
